[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persontts"
version = "0.1.0"
description = "Personalized test-time scaling with amortized controller discovery"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "matplotlib>=3.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
